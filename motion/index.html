<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OxFlow · Motion Studio</title><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">✦</span><input id="title" class="title-input" maxlength="120" value="Motion project" aria-label="Project name"><span class="badge">BETA</span></div>
  <div class="top-chips"><span class="chip" id="engineChip">Flow · Omni 1.2 Flash</span><span class="chip" id="readyChip">Add a video</span><button id="newProject" class="ghost">＋ New</button></div>
</header>
<div id="runBar" class="run-bar" hidden><span id="runText">Working…</span><div class="bar"><i id="runFill"></i></div></div>
<main class="studio">
  <aside class="panel settings" aria-label="Settings">
    <div class="grid2">
      <label class="field"><span>Model</span><select id="model" disabled><option>Omni 1.2 Flash</option></select></label>
      <label class="field"><span>Reference mode</span><select id="refMode" disabled><option>Character only</option></select></label>
      <label class="field"><span>Video ratio</span><select id="ratio"><option value="portrait">9:16</option><option value="landscape">16:9</option></select></label>
      <label class="field"><span>Resolution</span><select id="resolution"><option value="720p">720p</option><option value="360p">360p · draft, about 1/3 credits</option></select></label>
    </div>
    <label class="field" id="downloadField" hidden><span>Download size <small>(Flow upscales the 360p draft)</small></span><select id="download"><option value="same">360p · as generated</option><option value="720p">720p · upscaled</option></select></label>
    <label class="field"><span>Piece length <small>(Flow makes the video in pieces)</small></span><select id="pieceSeconds"><option value="5">Up to 5 s</option><option value="6">Up to 6 s</option><option value="8" selected>Up to 8 s</option><option value="10">Up to 10 s</option><option value="12">Up to 12 s</option><option value="15">Up to 15 s</option></select></label>
    <div class="field"><span>Reference images</span>
      <label class="ref-card" id="characterDrop"><img id="characterThumb" alt="" hidden><span class="ref-icon" id="characterIcon">♙</span><span class="ref-text"><strong>Character</strong><small id="characterMeta">Drop an image or choose from saved characters</small></span><input id="character" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <div class="ref-actions"><button id="library" class="link">▦ Saved characters</button><button id="clearCharacter" class="link" hidden>Remove</button></div>
      <label class="ref-card small" id="backgroundDrop"><span class="ref-icon">▭</span><span class="ref-text"><strong>Background <em>optional</em></strong><small id="backgroundMeta">Leave empty to keep the video's place</small></span><input id="background" type="file" accept="image/png,image/jpeg,image/webp"></label>
    </div>
    <label class="field"><span>Custom prompt</span><textarea id="prompt" rows="3" maxlength="1000" placeholder="Add instructions to the end of every piece's prompt, e.g. keep the outfit, studio lights"></textarea><small class="count" id="promptCount">0 / 1000</small></label>
    <div class="toggles">
      <label class="toggle"><span><strong>Continuity between pieces</strong><small>Sends the last frame of the previous piece as an extra reference so the pieces join smoothly. Pieces are made one after another.</small></span><input type="checkbox" id="continuity"><i></i></label>
      <label class="toggle"><span><strong>Use original audio</strong><small>Replaces the generated sound with the source video's sound after joining.</small></span><input type="checkbox" id="originalAudio" checked><i></i></label>
      <label class="toggle"><span><strong>Automatically download final video</strong><small>Downloads after joining.</small></span><input type="checkbox" id="autoDownload" checked><i></i></label>
    </div>
    <label class="field"><span>Flow project</span><select id="flow"><option value="new">New Flow project · automatic</option></select></label>
    <div class="run-buttons"><button id="generate" class="primary">✦ Generate</button><button id="pause" class="ghost" hidden>Ⅱ Pause</button></div>
    <p class="hint" id="costHint">Add a video and a character.</p>
  </aside>

  <section class="panel stage" aria-label="Video">
    <div class="stage-head"><h2>Source video</h2><span id="sourceMeta" class="muted">No video selected</span><div class="stage-tabs" role="tablist"><button role="tab" id="tabSource" aria-selected="true">Source</button><button role="tab" id="tabTemplates" aria-selected="false">Templates</button><button role="tab" id="tabCompare" aria-selected="false" disabled>Compare</button></div></div>
    <div class="screens" id="screens" data-view="source">
      <label class="drop" id="sourceDrop"><span class="drop-icon">⬆</span><strong>Drop video here</strong><small>MP4, MOV or WebM · up to 3 minutes · avoid people talking (Flow refuses speech)</small><span class="pill">Choose video</span><input id="source" type="file" accept="video/mp4,video/quicktime,video/webm"></label>
      <figure class="screen" id="sourceScreen" hidden><video id="sourceVideo" controls playsinline></video><figcaption>Original</figcaption></figure>
      <div class="templates" id="templates" hidden aria-label="Motion templates"></div>
      <figure class="screen" id="resultScreen" hidden><video id="resultVideo" controls playsinline></video><figcaption>Motion Control</figcaption></figure>
    </div>
    <div class="stage-tools"><button id="replaceSource" class="ghost small">⟳ Choose / replace video</button><button id="playBoth" class="ghost small" disabled>▶ Play both</button><button id="downloadFinal" class="ghost small" disabled>⬇ Download final</button><button id="joinAgain" class="ghost small" disabled>⧉ Join again</button></div>
  </section>

  <section class="panel timeline" aria-label="Pieces">
    <div class="timeline-head"><h2>Pieces</h2><span id="piecesMeta" class="muted">Split the source video to make the pieces</span></div>
    <div class="tracks" id="tracks">
      <div class="track-label"><strong>SOURCE</strong><small>Source clip</small></div><div class="track-row" id="rowSource"></div>
      <div class="track-label"><strong>AUDIO</strong><small>Original sound</small></div><div class="track-row" id="rowAudio"></div>
      <div class="track-label"><strong>FLOW</strong><small>Generated</small></div><div class="track-row" id="rowFlow"></div>
    </div>
  </section>
</main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">Confirm run</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel" class="ghost">Cancel</button><button id="confirmGo" class="primary">▶ Generate</button></div></dialog>
<script type="module" src="studio.mjs"></script>
</body></html>
